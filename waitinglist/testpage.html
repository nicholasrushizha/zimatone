<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Header Menu</title>

<style>
                        /* RESET */
                        * {
                        margin: 0;
                        padding: 0;
                        box-sizing: border-box;
                        font-family: Arial, sans-serif;
                        }

                        /* TOP HEADER */
                        .top-header {
                        width: 100%;
                        background: rgb(60,100,228);
                        color: white;
                        text-align: center;
                        padding: 18px 10px;
                        font-size: 22px;
                        font-weight: bold;
                        letter-spacing: 1px;
                        position: fixed;
                        top: 0;
                        z-index: 1000;
                        }

                        /* SECOND BAR */
                        .nav-bar {
                        position: fixed;
                        top: 60px;
                        width: 100%;
                        height: 55px;
                        background: #111827;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        z-index: 999;
                        }

                        /* CENTER TITLE */
                        .nav-title {
                        color: white;
                        font-size: 18px;
                        font-weight: 600;
                        }

                        /* MENU ICON */
                        .menu-icon {
                        position: absolute;
                        left: 20px;
                        width: 30px;
                        height: 22px;
                        cursor: pointer;
                        display: flex;
                        flex-direction: column;
                        justify-content: space-between;
                        }

                        .menu-icon span {
                        height: 3px;
                        background: white;
                        border-radius: 5px;
                        transition: 0.3s;
                        }

                        /* ANIMATION TO X */
                        .menu-icon.active span:nth-child(1) {
                        transform: rotate(45deg) translate(5px, 5px);
                        }
                        .menu-icon.active span:nth-child(2) {
                        opacity: 0;
                        }
                        .menu-icon.active span:nth-child(3) {
                        transform: rotate(-45deg) translate(6px, -6px);
                        }

                        /* MENU OVERLAY */
                        .menu {
                        position: fixed;
                        top: 115px; /* below header + nav bar */
                        left: 0;
                        width: 100%;
                        height: calc(100vh - 115px);
                        background: linear-gradient(135deg, #0f172a, #1e293b);
                        transform: translateY(-100%);
                        transition: 0.4s ease;
                        z-index: 998;
                        display: flex;
                        flex-direction: column;
                        align-items: center;
                        padding-top: 40px;
                        }

                        /* OPEN MENU */
                        .menu.open {
                        transform: translateY(0);
                        }

                        /* BUTTONS */
                        .menu button {
                        width: 80%;
                        max-width: 320px;
                        padding: 14px;
                        margin: 10px 0;
                        border: none;
                        border-radius: 12px;
                        font-size: 16px;
                        cursor: pointer;
                        transition: 0.3s;
                        color: white;
                        background: #334155;
                        }

                        .menu button:hover {
                        background: #475569;
                        transform: scale(1.03);
                        }

                        /* LOGIN BUTTON SPECIAL */
                        .menu .login {
                        margin-top: 30px;
                        margin-bottom: 40px;
                        background: linear-gradient(90deg, #f97316, #ef4444);
                        font-weight: bold;
                        }

                        .menu .login:hover {
                        background: linear-gradient(90deg, #fb923c, #f87171);
                        }
</style>
</head>

<body>

<!-- HEADER -->
<div class="top-header">
  My Website
</div>

<!-- NAV BAR -->
<div class="nav-bar">
  
  <div class="menu-icon" id="menuIcon">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <div class="nav-title">Main Page</div>
</div>

<!-- MENU -->
<div class="menu" id="menu">

  <button>Home</button>
  <button>About</button>
  <button>Services</button>
  <button>Blog</button>
  <button>Contact</button>

  <button class="login">Login</button>

</div>

<script>
const menuIcon = document.getElementById("menuIcon");
const menu = document.getElementById("menu");

menuIcon.addEventListener("click", () => {
  menuIcon.classList.toggle("active");
  menu.classList.toggle("open");
});
</script>

</body>
</html>
